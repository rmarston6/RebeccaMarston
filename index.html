    html, body {
      margin: 0;

      min-height: 100vh;
      font-family: 'Digitany', sans-serif;
      background: black;
      overflow-x: hidden;
      overflow-y: auto;

      overflow-y: auto;

    /* --- Potato Icon Button --- */
    #icon-button {
      position: fixed;
      top: 2vw;
      right: 1vw;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img {
      width: 15vw;
      height: 15vw;
      max-width: 180px;
      max-height: 180px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
    }

    /* --- Affirmation UI --- */
    #affirmation-ui {
      position: fixed;
      right: 10%;
      top: calc(1.3vw + 165px); /* adjust as needed for icon position */
      transform: translate(72%, 21%);
      z-index: 2001;
      background: transparent;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      width: 250px;
      max-width: 90vw;
      text-align: center;
    }
    #affirmation-ui.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #affirmation-img {
      width: 135%;
      max-width: 400px;
      height: 100% !important;
      max-height: 900px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }
    #affirmation-text {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-37%, -25%);
      width: 110%;
      font-family: 'Digitany', sans-serif;
      font-size: 1.08em;
      color: #b49aff;
      text-shadow: 0 0 8px #fff8ff, 0 1px 8px #b49aff;
      padding: 0.5em 0.2em;
      pointer-events: none;
      background: transparent;
      word-break: break-word;
      z-index: 2;
    }

    /* --- HERO SECTION --- */
    .hero {
      width: 100vw;
      min-height: 100vh;
      height: auto;
      max-height: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 4;
      pointer-events: auto;
      margin: 0;
      padding: 0;
    }
    .video-background {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: url('49.jpg') center center no-repeat;
      background-size: cover;
    }
    #particles-js {
      position: absolute;
      width: 100vw;
      height: 100vh;
      z-index: 6;
      top: 0;
      left: 0;
      pointer-events: none;
      transform: scaleX(-1);
      overflow-y: hidden;
    }
    .hero h1 {
      position: absolute;
      z-index: 5;
      font-size: 8.1vw;
      margin: 0;
      line-height: 1;
      font-family: 'Digitany', sans-serif;
      color: white;
      letter-spacing: normal;
      text-align: center;
      margin-bottom: .8vw;
      margin-top: 10vw;
      width: 100vw;
      word-break: break-word;
      transform: translate(0, -110%);
    }

    /* --- SCROLL BG FIXED --- */
    .scroll-bg {
      /* Set aspect ratio to match scroll.png, e.g. 4:1 (width:height) */
      aspect-ratio: 1.066 / 1; /* Replace 4/1 with your actual scroll.png aspect ratio if different */
      width: 90vw;
      max-width: 1200px;
      min-width: 180px;
      background: url('scroll.png') center center no-repeat;
      background-size: contain;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0vw auto 0 auto;
      position: relative;
      z-index: 7;
      font-size: 1vw;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
      overflow: hidden;
      transform: translate(0, 25%);
      /* Remove fixed height! */
    }
    .scroll-bg span {
      width: 90%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1em;
      word-break: break-word;
      transform: translate( .7em, 0);
      /* Remove transform unless you need fine-tuning */
    }

    /* --- MAIN CONTENT --- */
    .main-content {
      display: grid;
      position: relative; /* allow absolute children */
      background: none;
      width: 100vw;
      grid-template-columns: 2fr 2fr 2fr 2fr;
      grid-template-rows: repeat(4, 2fr);
      gap: 2vw;
      isolation: isolate;
      z-index: 2;
      padding-bottom: 70px;
      padding-top: 6vw;
    }
    .main-content img {
      will-change: transform;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      width: 80%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;

<body>

    <!-- Potato Icon Button -->

    <!-- Affirmation UI -->

      <span id="affirmation-text"></span>
    </div>
  
    <!-- HERO SECTION -->

      <h1>Rebecca Marston</h1>

        <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>

    <!-- MAIN CONTENT BELOW HERO -->

      <img src="loading-bar.gif" alt="Loading Animation">
    </div>

  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });

    // Affirmations array
    const affirmations = [
      "You are enough, just as you are.",
      "You never know.",
      "You are capable of amazing things.",
      "Your kindness makes a difference.",
      "Rest is productive, too.",
      "You can do hard things.",
      "Your creativity is valuable.",
      "If you're carrying it, make it mean something.",
      "It's okay to take it slow.",
      "You have grown so much."
    ];

    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const affirmationUI = document.getElementById('affirmation-ui');
    const affirmationText = document.getElementById('affirmation-text');
    const affirmationImg = document.getElementById('affirmation-img');

    let potatoAwake = false;

    function setAffirmationImage() {
      if (window.innerWidth <= 700 || window.innerHeight <= 700) {
        affirmationImg.src = "mobile-retro-computer-20.png";
      } else {
        affirmationImg.src = "mobile-retro-computer-20.png";
      }
    }

    iconButton.addEventListener('click', (event) => {
      event.stopPropagation();
      setAffirmationImage();
      if (!potatoAwake) {
        icon.src = 'potatoawake.PNG';
        potatoAwake = true;
        // Pick a random affirmation
        const randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)];
        affirmationText.textContent = randomAffirmation;
        affirmationUI.classList.add('visible');
      } else {
        icon.src = 'potato 3.PNG';
        potatoAwake = false;
        affirmationUI.classList.remove('visible');
      }
    });

    // Optional: prevent affirmation text itself from blocking clicks
    affirmationText.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    // Swap image when resizing window (optional, for dynamic responsiveness)
    window.addEventListener('resize', function() {
      if (potatoAwake) setAffirmationImage();
    });

    // Hide affirmation UI if click outside potato icon or affirmation area
    document.addEventListener('click', function(event) {
      const isClickOnIcon = iconButton.contains(event.target);
      const isClickOnUI = affirmationUI.contains(event.target);
      if (potatoAwake && !isClickOnIcon && !isClickOnUI) {
        icon.src = 'potato 3.PNG';
        potatoAwake = false;
        affirmationUI.classList.remove('visible');
      }
    });

    // ---------- GIF MODAL LOGIC FOR ETSY & SUBSCRIBE ----------
    const gifModal = document.getElementById('gif-modal');
    const gifLinks = document.querySelectorAll('.show-gif-modal');

    function isMobileDevice() {
      return /Mobi|Android|iPad|iPhone|iPod|Tablet|Touch/.test(navigator.userAgent);
    }

    gifLinks.forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        if (!isMobileDevice()) {
          // DESKTOP/LAPTOP: Show GIF, then open link
          gifModal.style.display = 'flex';
          setTimeout(() => {
            window.open(link.href, '_blank');
            gifModal.style.display = 'none';
          }, 2000);
        } else {
          // MOBILE/TABLET: Open link immediately, no GIF
          window.open(link.href, '_blank');
        }
      });
    });

    gifModal.addEventListener('click', function(event) {
      if (event.target === gifModal) {
        gifModal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
