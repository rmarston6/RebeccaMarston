<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="IMG_3198.png">
  <meta charset="UTF-8">
  <title>Rebecca Marston</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Digitany', sans-serif;
      background: black;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      min-height: 100vh;
      background: url('desk.PNG') center center / cover;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* --- Fixed Menu Button and Menu --- */
    #icon-button {
      position: fixed;
      top: 2vw;
      right: 1vw;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img {
      width: 15vw;
      height: 15vw;
      max-width: 180px;
      max-height: 180px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
    }
        /* --- Affirmation UI --- */
    #affirmation-ui {
      position: fixed;
      right: 10%;
      top: calc(1.3vw + 180px); /* adjust as needed for icon position */
      transform: translate(100%, -22%);
      z-index: 2001;
      background: transparent;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      width: 250px;
      max-width: 90vw;
      text-align: center;
    }
    #affirmation-ui.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #affirmation-ui img {
      width: 100%;
      max-width: 400px;
      height: 280px;
      max-height: 800px;
      display: block;
      margin: 0 auto;
    }
    #affirmation-text {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, 5%);
      width: 67%;
      font-family: 'Digitany', sans-serif;
      font-size: 1.1em;
      color: #b49aff;
      text-shadow: 0 0 8px #fff8ff, 0 1px 8px #b49aff;
      padding: 0.5em 0.2em;
      pointer-events: none;
      background: transparent;
      word-break: break-word;
      z-index: 2;
    }

    /* --- HERO SECTION --- */
    .hero {
      width: 100vw;
      min-height: 100vh;
      height: auto;
      max-height: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 4;
      pointer-events: auto;
      margin: 0;
      padding: 0;
    }
    .video-background {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: url('49.jpg') center center no-repeat;
      background-size: cover;
    }
    #particles-js {
      position: absolute;
      width: 100vw;
      height: 100vh;
      z-index: 6;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .hero h1 {
      position: relative;
      z-index: 5;
      font-size: 8.1vw;
      margin: 0;
      line-height: 1;
      font-family: 'Digitany', sans-serif;
      color: white;
      letter-spacing: normal;
      text-align: center;
      margin-bottom: 2vw;
      margin-top: 6vw;
      width: 100vw;
      word-break: break-word;
    }
    .scroll-bg {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2vw auto 0 auto;
      width: 70vw;
      min-width: 180px;
      height: 3.5vw;
      background: url('scroll.png') center center no-repeat;
      background-size: cover;
      z-index: 7;
      position: relative;
      font-size: 1.20vw;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
    }
    .scroll-bg span {
      padding-top: 0.8vw;
      width: 100%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      word-break: break-word;
      transform: translate(-0.5%, -5%);
    }

    /* --- MAIN CONTENT --- */
    .main-content {
      display: grid;
      position: relative; /* allow absolute children */
      background: none;
      width: 100vw;
      /* FIX: Make planner cell bigger */
      grid-template-columns: 2fr 2fr 2fr 2fr;
      grid-template-rows: repeat(4, 2fr);
      gap: 2vw;
      isolation: isolate;
      z-index: 2;
      padding-bottom: 70px;
      padding-top: 6vw;
    }
    .main-content img {
      width: 80%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;
    }

    /* Individual PNG Sizing: Desktop/tablet */
    .coffee-mug      {  grid-column: 1; grid-row: 4; width: 80%; max-width: 140px; }
    .fiddle-leaf-fig-plant {  grid-column: 4; grid-row: 2; width: 85%; max-width: 180px; }
    .jade-plant      {  grid-column: 1; grid-row: 2; width: 70%; max-width: 120px; }
    /* FIX: Planner wider */
    .planner         {  grid-column: 3; grid-row: 3; width: 170%; max-width: 900px; transform: translate(-50%, -140%) rotate(15deg); }
    .red-book        {  grid-column: 4; grid-row: 3; width: 50%; max-width: 100px; }
    .wisteriabonsai  {  grid-column: 1; grid-row: 1; width: 60%; max-width: 140px; transform: translate(-50%, -40%); }

    /* --- UI Layer Overlay --- */
    .ui-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      pointer-events: none; /* disables events for the overlay itself */
    }
    /* UI windows are grid items in overlay */
    .ui-layer img,
    .ui-layer a {
      pointer-events: auto; /* enables clicks for the UI windows! */
      width: 80%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;
    }

    /* Example UI window grid placement */
    .ui-author        { grid-column: 2; grid-row: 2; transform: translate(0%, -20%); width: 80%; max-width: 200px;}
    .ui-etsy          { grid-column: 4; grid-row: 3; transform: translate(50px, 0px); width: 80%; max-width: 200px;}
    .ui-current-works { grid-column: 4; grid-row: 4; transform: translate(-50px, 0px); width: 80%; max-width: 200px;}
    .ui-subscribe     { grid-column: 5; grid-row: 5; transform: translate(-100px, 0px); width: 60%; max-width: 200px;}

    /* --- Responsive tweaks for mobile --- */
    @media (max-width: 700px), (max-height: 700px) {
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        height: 100%;
      }
      .hero,
      .video-background,
      #particles-js {
        width: 100vw;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        height: 100%;
        max-height: none;
      }
      .hero h1 { font-size: 12vw; margin-top: 10vw; width: 100vw; }
      .scroll-bg { width: 97vw; font-size: 4vw; height: 12vw; min-width: 120px;}
      .main-content {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 1vw;
        isolation: isolate;
        /* FIX: Remove min/max heights and overflow-y to prevent separate scroll */
        min-height: unset;
        max-height: unset;
        padding-top: 6vw;
        padding-bottom: 50px;
        overflow: visible !important;
      }
      .main-content img {
        width: 90%;
        max-width: 100%;
        height: auto;
        object-fit: contain;
        justify-self: center;
        align-self: center;
        transition: all 0.2s;
      }
      .ui-layer {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 100%;
        height: 100%;
        overflow: visible !important;
      }
      /* PNG Sizing: Mobile + Transforms (COMBINED!) */
      .coffee-mug         { width: 70%; max-width: 120px; }
      .fiddle-leaf-fig-plant { width: 80%; max-width: 130px; }
      .jade-plant         { width: 75%; max-width: 110px; transform: translate(50%, 0%); }
      .planner            { width: 100%; max-width: 400px; transform: translate(80%, -30%) rotate(15deg);}
      .red-book           { width: 65%; max-width: 90px; }
      .wisteriabonsai     { width: 75%; max-width: 120px; }
      /* UI Windows Mobile Placement */
      .ui-author          { width: 85%; max-width: 130px; grid-column: 1; grid-row: 1; transform: none;}
      .ui-etsy            { width: 75%; max-width: 110px; grid-column: 2; grid-row: 2; transform: none;}
      .ui-current-works   { width: 90%; max-width: 150px; grid-column: 1; grid-row: 3; transform: none;}
      .ui-subscribe       { width: 90%; max-width: 180px; grid-column: 2; grid-row: 4; transform: translate(0%, -95%);}
      /* Make the menu icon larger on mobile */
     #icon-button img {
        width: 22vw;
        height: 22vw;
        max-width: 200px;
        max-height: 200px;
      }
      #affirmation-ui {
        width: 90vw;
        max-width: 90vw;
        top: calc(2vw + 200px);
      }
      #affirmation-text {
        font-size: 1em;
        width: 85%;
      }
    }
  </style>
</head>
<body>
  
    <!-- Potato Icon Button -->
    <button id="icon-button">
      <img id="menu-icon" src="potato 3.PNG" alt="Potato">
    </button>
    <!-- Affirmation UI -->
    <div id="affirmation-ui">
      <img src="retro-computer-icon-9.svg" alt="Affirmation UI">
      <span id="affirmation-text"></span>
    </div>
  
    <!-- HERO SECTION -->
    <section class="hero" id="hero">
      <div class="video-background"></div>
      <div id="particles-js"></div>
      <h1>Rebecca Marston</h1>
      <div class="scroll-bg">
        <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
      </div>
    </section>
    <!-- MAIN CONTENT BELOW HERO -->
    <section class="main-content">
      <img src="coffee mug.PNG" alt="Coffee Mug" class="coffee-mug" />
      <img src="fiddleleaffig.PNG" alt="Fiddle Leaf Fig" class="fiddle-leaf-fig-plant" />
      <img src="jadeplant.PNG" alt="Jade Plant" class="jade-plant" />
      <img src="planner.PNG" alt="Planner" class="planner" />
      <img src="redbook.PNG" alt="Red Book" class="red-book" />
      <img src="wisteriabonsai.PNG" alt="Wisteria Bonsai" class="wisteriabonsai" />
      <!-- Foreground UI Windows in overlay grid -->
      <div class="ui-layer">
        <img src="AuthorUI.png" class="ui-author" alt="Author UI" />
        <a href="https://www.etsy.com/shop/Elevatai" target="_blank" class="ui-etsy">
          <img src="EtsyLink.png" alt="Etsy UI" />
        </a>
        <img src="CurrentWorksUI.png" class="ui-current-works" alt="Current Works UI" />
        <a href="https://rebeccamarston.kit.com/193ca21bb0" target="_blank" class="ui-subscribe">
          <img src="SubscribeUI.png" alt="Subscribe UI" />
        </a>
      </div>
    </section>
  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });
    // Affirmations array
    const affirmations = [
      "You are enough, just as you are.",
      "Every day is a new beginning.",
      "You are capable of amazing things.",
      "Your kindness makes a difference.",
      "Rest is productive, too.",
      "You can do hard things.",
      "Your creativity is valuable.",
      "You are loved.",
      "It's okay to take it slow.",
      "You have grown so much."
    ];

    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const affirmationUI = document.getElementById('affirmation-ui');
    const affirmationText = document.getElementById('affirmation-text');

    let potatoAwake = false;

    iconButton.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!potatoAwake) {
        icon.src = 'potatoawake.PNG';
        potatoAwake = true;
        // Pick a random affirmation
        const randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)];
        affirmationText.textContent = randomAffirmation;
        affirmationUI.classList.add('visible');
      } else {
        icon.src = 'potato 3.PNG';
        potatoAwake = false;
        affirmationUI.classList.remove('visible');
      }
    });

    // Hide affirmation UI if click outside potato icon or affirmation area
    document.addEventListener('click', function(event) {
      const isClickOnIcon = iconButton.contains(event.target);
      const isClickOnUI = affirmationUI.contains(event.target);
      if (potatoAwake && !isClickOnIcon && !isClickOnUI) {
        icon.src = 'potato 3.PNG';
        potatoAwake = false;
        affirmationUI.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
