  <style>
    @font-face {

    body {
      margin: 0;

    /* --- Fixed Menu Button and Menu --- */

    #side-menu {

    #side-menu ul {

      margin: 0;
      padding: 0;

    #side-menu li {

    /* --- HERO SECTION --- */
    section {margin: 0;
             padding: 0;
      }
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      flex-direction: column;

    #particles-js {

    /* REMOVED: .cloud-behind-name and related styles */
    .hero h1 {
      position: relative;
      z-index: 5;
      font-size: 11vw;
      margin: 0 0 0px 0;

    .scroll-bg {

      padding-bottom: 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 18px auto 0 auto;
      width: 800px;
      min-width: 320px;
      height: 150px;

      height: 100%;
      align-items: center;

    /* --- MAIN CONTENT BELOW HERO --- */
    .main-content {
      display: grid;
      position: relative;
      background: none;
      padding-bottom: 0px;
      width: 100%;
      margin-top: 0;
      padding-top: 0;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 320px);
      gap: 40px;
      isolation: isolate;
      z-index: 2;
    }
    
    /* Dappled light overlay covers the main-content area */
      .dappled-light {
  position: absolute;
  inset: -20vh -20vw;   /* bigger than the section on all sides */
  overflow: hidden;
  pointer-events: none;
  z-index: 4;           /* under .ui-layer (5), above desk/objects (3) */
}

      .shapes{
  color: transparent;
  background-color: rgba(0,0,0,0.22);   /* soft shadow */
  text-shadow: 0 0 90px #fff;           /* big glow halo */
  font-weight: 800;
  font-family: monospace;
  font-size: clamp(280px, 32vw, 10000px); /* <<< was 320pt */
  line-height: 1;
  mix-blend-mode: multiply;
  margin: 0;
  position: absolute;
  will-change: transform;
}
        /* Scatter positions (tweak freely) */
.dappled-light .shapes:nth-of-type(1) { transform: translate(5vw,  5vh) rotate(-6deg);  opacity: .9; }
.dappled-light .shapes:nth-of-type(2) { transform: translate(55vw, 8vh) rotate(8deg);  opacity: .8; }
.dappled-light .shapes:nth-of-type(3) { transform: translate(15vw, 32vh) rotate(3deg); opacity: .85; }
.dappled-light .shapes:nth-of-type(4) { transform: translate(70vw, 30vh) rotate(-12deg);opacity: .75; }
.dappled-light .shapes:nth-of-type(5) { transform: translate(35vw, 50vh) rotate(4deg); opacity: .9; }
.dappled-light .shapes:nth-of-type(6) { transform: translate(2vw,  60vh) rotate(-8deg); opacity: .7; }
.dappled-light .shapes:nth-of-type(7) { transform: translate(60vw, 62vh) rotate(6deg); opacity: .8; }
.dappled-light .shapes:nth-of-type(8) { transform: translate(25vw, 78vh) rotate(-4deg); opacity: .75; }
.dappled-light .shapes:nth-of-type(9) { transform: translate(75vw, 78vh) rotate(10deg); opacity: .8; }
.dappled-light .shapes:nth-of-type(10){ transform: translate(40vw, 90vh) rotate(-2deg); opacity: .85; }
             /* Define keyframe animations for subtle horizontal movement */
             @keyframes move {
             from { text-indent: -20px; }
             to   { text-indent: 20px; }
           }
             @keyframes move-1 {
             from { text-indent: -60px; }
             to   { text-indent: 40px; }
           }

             /* Apply animations to the overlay shapes (run indefinitely, no hover needed) */
             .dappled-light .shapes:nth-of-type(1) {
             animation: move 2s ease-in-out infinite alternate;
           }
             .dappled-light .shapes:nth-of-type(2) {
             animation: move-1 4s ease-in-out infinite alternate;
           }
             /* (The 3rd shape is left static for a bit of irregularity, but you can animate it too) */
    @keyframes driftX { from { text-indent: -30px; } to { text-indent: 30px; } }
}
@keyframes sway { 
  0%   { transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(1); }
  100% { transform: translate(calc(var(--tx) + 8px), calc(var(--ty) - 8px)) rotate(calc(var(--r) + 1.5deg)) scale(1.02); }
}

/* Use per-shape CSS variables so their original translate/rotate remain */
.dappled-light .shapes { 
  --tx: 0px; --ty: 0px; --r: 0deg;
  animation: driftX 3.2s ease-in-out infinite alternate;
}

/* Bind each element’s starting transform to variables so sway anim can offset it */
.dappled-light .shapes { will-change: transform; }
.dappled-light .shapes:nth-of-type(1) { --tx: 5vw;  --ty: 5vh;  --r: -6deg;  animation: driftX 2.6s ease-in-out infinite alternate, sway 6.5s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(2) { --tx: 55vw; --ty: 8vh;  --r: 8deg;   animation: driftX 3.8s ease-in-out infinite alternate,  sway 7.5s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(3) { --tx: 15vw; --ty: 32vh; --r: 3deg;   animation: driftX 3.2s ease-in-out infinite alternate,  sway 8.2s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(4) { --tx: 70vw; --ty: 30vh; --r:-12deg;  animation: driftX 4.1s ease-in-out infinite alternate,  sway 7.8s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(5) { --tx: 35vw; --ty: 50vh; --r: 4deg;   animation: driftX 2.9s ease-in-out infinite alternate,  sway 6.9s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(6) { --tx: 2vw;  --ty: 60vh; --r: -8deg;  animation: driftX 3.6s ease-in-out infinite alternate,  sway 8.6s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(7) { --tx: 60vw; --ty: 62vh; --r: 6deg;   animation: driftX 3.3s ease-in-out infinite alternate,  sway 6.7s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(8) { --tx: 25vw; --ty: 78vh; --r: -4deg;  animation: driftX 4.0s ease-in-out infinite alternate,  sway 8.9s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(9) { --tx: 75vw; --ty: 78vh; --r: 10deg;  animation: driftX 3.1s ease-in-out infinite alternate,  sway 7.2s ease-in-out infinite alternate; }
.dappled-light .shapes:nth-of-type(10){ --tx: 40vw; --ty: 90vh; --r: -2deg;  animation: driftX 3.7s ease-in-out infinite alternate,  sway 9.1s ease-in-out infinite alternate; }

  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });

    // Icon swap and menu toggle
    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const sideMenu = document.getElementById('side-menu');

    iconButton.addEventListener('click', () => {
      if (
        icon.src.endsWith('potato%203.PNG') ||
        icon.src.endsWith('potato 3.PNG')
      ) {
        icon.src = 'potatoawake.PNG';
        sideMenu.classList.add('show');
      } else {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });

    document.addEventListener('click', function(event) {
      const isClickOnMenu = sideMenu.contains(event.target);
      const isClickOnIcon = iconButton.contains(event.target);

      if (sideMenu.classList.contains('show') && !isClickOnMenu && !isClickOnIcon) {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });

    // HERO FADE-OUT ON SCROLL
    window.addEventListener('scroll', function() {
      const hero = document.querySelector('.hero');
      let scrollY = window.scrollY;
      let fadeStart = 0, fadeEnd = window.innerHeight * 0.7;
      let opacity = 1;
      if (scrollY > fadeStart) {
        opacity = 1 - Math.min((scrollY - fadeStart) / (fadeEnd - fadeStart), 1);
      }
      hero.style.opacity = opacity;
      hero.style.pointerEvents = (opacity < 0.1) ? "none" : "auto";
    });
  </script>
