<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="IMG_3198.png">
  <meta charset="UTF-8">
  <title>Rebecca Marston</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Digitany', sans-serif;
      background: black;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      min-height: 100vh;
      background: url('desk.PNG') center center / cover;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* --- Potato Icon Button --- */
    #icon-button {
      position: fixed;
      top: 2vw;
      right: 1vw;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img {
      width: 15vw;
      height: 15vw;
      max-width: 180px;
      max-height: 180px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
    }

    /* --- Affirmation UI --- */
    #affirmation-ui {
      position: fixed;
      right: 10%;
      top: calc(1.3vw + 165px); /* adjust as needed for icon position */
      transform: translate(72%, 21%);
      z-index: 2001;
      background: transparent;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      width: 250px;
      max-width: 90vw;
      text-align: center;
    }
    #affirmation-ui.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #affirmation-img {
      width: 135%;
      max-width: 400px;
      height: 100% !important;
      max-height: 900px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }
    #affirmation-text {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-37%, -25%);
      width: 110%;
      font-family: 'Digitany', sans-serif;
      font-size: 1.08em;
      color: #b49aff;
      text-shadow: 0 0 8px #fff8ff, 0 1px 8px #b49aff;
      padding: 0.5em 0.2em;
      pointer-events: none;
      background: transparent;
      word-break: break-word;
      z-index: 2;
    }

    /* --- HERO SECTION --- */
    .hero {
      width: 100vw;
      min-height: 100vh;
      height: auto;
      max-height: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 4;
      pointer-events: auto;
      margin: 0;
      padding: 0;
    }
    .video-background {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: url('49.jpg') center center no-repeat;
      background-size: cover;
    }
    #particles-js {
      position: absolute;
      width: 100vw;
      height: 100vh;
      z-index: 6;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .hero h1 {
      position: relative;
      z-index: 5;
      font-size: 8.1vw;
      margin: 0;
      line-height: 1;
      font-family: 'Digitany', sans-serif;
      color: white;
      letter-spacing: normal;
      text-align: center;
      margin-bottom: 2vw;
      margin-top: 6vw;
      width: 100vw;
      word-break: break-word;
    }
    .scroll-bg {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2vw auto 0 auto;
      width: 70vw;
      min-width: 180px;
      height: 3.5vw;
      background: url('scroll.png') center center no-repeat;
      background-size: cover;
      z-index: 7;
      position: relative;
      font-size: 1.20vw;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
    }
    .scroll-bg span {
      padding-top: 0.8vw;
      width: 100%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      word-break: break-word;
      transform: translate(-0.5%, -5%);
    }

    /* --- MAIN CONTENT --- */
    .main-content {
      display: grid;
      position: relative; /* allow absolute children */
      background: none;
      width: 100vw;
      grid-template-columns: 2fr 2fr 2fr 2fr;
      grid-template-rows: repeat(4, 2fr);
      gap: 2vw;
      isolation: isolate;
      z-index: 2;
      padding-bottom: 70px;
      padding-top: 6vw;
    }
    .main-content img {
      width: 80%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;
    }

    /* Individual PNG Sizing: Desktop/tablet */
    .coffee-mug      {  grid-column: 1; grid-row: 4; transform: scale(1.5) translate(0%, 0%); }
    .fiddle-leaf-fig-plant {  grid-column: 4; grid-row: 2; transform: scale(1.5) rotate(250deg) translate(100%, -30%); }
    .jade-plant      {  grid-column: 1; grid-row: 2; transform: scale(1.5) translate(0%, 0%); }
    .planner         {  grid-column: 3; grid-row: 3; transform: scale(2.5) rotate(21deg) translate(-20%, -30%);  }
    .red-book        {  grid-column: 4; grid-row: 3; transform: scale(2) translate(0%, -25%); }
    .wisteriabonsai  {  grid-column: 1; grid-row: 1; transform: scale(2.8) translate(-10%, -20%); }

    /* --- UI Layer Overlay --- */
    .ui-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      pointer-events: none;
    }
    .ui-layer img,
    .ui-layer a {
      pointer-events: auto;
      width: 100% !important;
      max-width: 280px !important;
      max-height: 280px !important;
      height: auto !important;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;
    }

    /* Example UI window grid placement */
    .ui-author        { grid-column: 2; grid-row: 2; transform: scale(3.2) translate(-33%, -105%);}
    .ui-etsy          { grid-column: 4; grid-row: 3; transform: scale(2) translate(80%, -80%);}
    .ui-current-works { grid-column: 4; grid-row: 4; transform: scale(3.6) translate(-130%, -70%);}
    .ui-subscribe     { grid-column: 5; grid-row: 5; transform: scale(3.5) translate(-70%, -35%);}




    
    /* --- Responsive tweaks for MOBILE PHONESSSSSSS --- */
    @media (max-width: 700px), (max-height: 700px) {
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        height: 100%;
      }
      .hero,
      .video-background,
      #particles-js {
        width: 100vw;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        height: 100%;
        max-height: none;
      }
      .hero h1 { font-size: 12vw; margin-top: 10vw; width: 100vw; }
      .scroll-bg { width: 97vw; font-size: 4vw; height: 12vw; min-width: 120px;}

      #icon-button img {
        width: 22vw;
        height: 22vw;
        max-width: 200px;
        max-height: 200px;
      }
      #affirmation-ui {
        width: 90vw;
        max-width: 90vw;
        top: calc(2vw + 200px);
        right: 10%;
        transform: translate(35%, -134%);
      }
      #affirmation-img {
        height: 50px;
        width: 180px;
      }
      #affirmation-text {
        font-size: .69em;
        width: 45%;
        transform: translate(-48%, -120%);
      }
      
      .main-content {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 1vw;
        isolation: isolate;
        min-height: unset;
        max-height: unset;
        padding-top: 6vw;
        padding-bottom: 50px;
        overflow: visible !important;
      }
      .main-content img {
        width: 90%;
        max-width: 100%;
        height: auto;
        object-fit: contain;
        justify-self: center;
        align-self: center;
        transition: all 0.2s;
      }
      .ui-layer {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 100%;
        height: 100%;
        overflow: visible !important;
      }
      .ui-layer img,
      .ui-layer a {
        width: 100% !important;
        max-width: 180px !important;
        max-height: 180px !important;
        height: auto !important;
      }
      .coffee-mug         { transform: scale(1.5); }
      .fiddle-leaf-fig-plant { transform: scale(1.5); }
      .jade-plant         { transform: scale(1.5); translate(50%, 0%); }
      .planner            { transform: scale(1.5); translate(80%, -30%) rotate(15deg);}
      .red-book           { transform: scale(1.5); }
      .wisteriabonsai     { transform: scale(1.5); }
      .ui-author          { grid-column: 1; grid-row: 1; transform: scale(1.5);}
      .ui-etsy            { grid-column: 2; grid-row: 2; transform: scale(1.5);}
      .ui-current-works   { grid-column: 1; grid-row: 3; transform: scale(1.5);}
      .ui-subscribe       { grid-column: 2; grid-row: 4; transform: scale(1.5) translate(0%, -95%);}
    }



    



/* 1920x1080 screens and similar SMALLER DESKTOPSSSSSSSSSSSS */

    @media (max-width: 2000px) and (min-width: 1400px) and (max-height: 1150px) {
  
  .main-content {
    gap: 1.2vw;
    padding-bottom: 50px;
    padding-top: 4vw;
  }
  .planner { transform: scale(2.1) rotate(19deg) translate(34%, -120%); }
  .ui-author { transform: scale(2.8) translate(0%, -20%); }
  .ui-etsy { transform: scale(1.4) translate(50px, 0px); }
  .ui-current-works { transform: scale(2.2) translate(-50px, 0px); }
  .ui-subscribe { transform: scale(1.5) translate(-50px, 0px); }
  /* Adjust other PNGs as needed here */
}






  /* LAPTOPSSSSSSSSS */ 
    
@media (max-width: 1400px) {
  .main-content {
    gap: 0.8vw;
    padding-bottom: 30px;
    padding-top: 3vw;
  }
  .planner { transform: scale(1.3) rotate(19deg) translate(8%, -90%); }
  .ui-author { transform: scale(1.7) translate(0%, -20%); }
  .ui-etsy { transform: scale(1.1) translate(35px, 0px); }
  .ui-current-works { transform: scale(1.5) translate(-15px, 0px); }
  .ui-subscribe { transform: scale(1.2) translate(-15px, 0px); }
  /* Adjust other PNGs as needed here */
}

  </style>
</head>
<body>

    <!-- Potato Icon Button -->
    <button id="icon-button">
      <img id="menu-icon" src="potato 3.PNG" alt="Potato">
    </button>
    <!-- Affirmation UI -->
    <div id="affirmation-ui">
      <img id="affirmation-img" src="retro-computer-20.png" alt="Affirmation UI">
      <span id="affirmation-text"></span>
    </div>
  
    <!-- HERO SECTION -->
    <section class="hero" id="hero">
      <div class="video-background"></div>
      <div id="particles-js"></div>
      <h1>Rebecca Marston</h1>
      <div class="scroll-bg">
        <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
      </div>
    </section>
    <!-- MAIN CONTENT BELOW HERO -->
    <section class="main-content">
      <img src="coffee mug.PNG" alt="Coffee Mug" class="coffee-mug" />
      <img src="fiddleleaffig.PNG" alt="Fiddle Leaf Fig" class="fiddle-leaf-fig-plant" />
      <img src="jadeplant.PNG" alt="Jade Plant" class="jade-plant" />
      <img src="planner.PNG" alt="Planner" class="planner" />
      <img src="redbook.PNG" alt="Red Book" class="red-book" />
      <img src="wisteriabonsai.PNG" alt="Wisteria Bonsai" class="wisteriabonsai" />
      <!-- Foreground UI Windows in overlay grid -->
      <div class="ui-layer">
        <img src="AuthorUI.png" class="ui-author" alt="Author UI" />
        <a href="https://www.etsy(dot)com/shop/Elevatai" target="_blank" class="ui-etsy">
          <img src="EtsyLink.png" alt="Etsy UI" />
        </a>
        <img src="CurrentWorksUI.png" class="ui-current-works" alt="Current Works UI" />
        <a href="https://rebeccamarston.kit.com/193ca21bb0" target="_blank" class="ui-subscribe">
          <img src="SubscribeUI.png" alt="Subscribe UI" />
        </a>
      </div>
    </section>
  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });

    // Affirmations array
    const affirmations = [
      "You are enough, just as you are.",
      "You never know.",
      "You are capable of amazing things.",
      "Your kindness makes a difference.",
      "Rest is productive, too.",
      "You can do hard things.",
      "Your creativity is valuable.",
      "If you're carrying it, make it mean something.",
      "It's okay to take it slow.",
      "You have grown so much."
    ];

    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const affirmationUI = document.getElementById('affirmation-ui');
    const affirmationText = document.getElementById('affirmation-text');
    const affirmationImg = document.getElementById('affirmation-img');

    let potatoAwake = false;

    function setAffirmationImage() {
      if (window.innerWidth <= 700 || window.innerHeight <= 700) {
        affirmationImg.src = "mobile-retro-computer-20.png";
      } else {
        affirmationImg.src = "mobile-retro-computer-20.png";
      }
    }

    iconButton.addEventListener('click', (event) => {
      event.stopPropagation();
      setAffirmationImage();
      if (!potatoAwake) {
        icon.src = 'potatoawake.PNG';
        potatoAwake = true;
        // Pick a random affirmation
        const randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)];
        affirmationText.textContent = randomAffirmation;
        affirmationUI.classList.add('visible');
      } else {
        icon.src = 'potato 3.PNG';
        potatoAwake = false;
        affirmationUI.classList.remove('visible');
      }
    });

    // Optional: prevent affirmation text itself from blocking clicks
    affirmationText.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    // Swap image when resizing window (optional, for dynamic responsiveness)
    window.addEventListener('resize', function() {
      if (potatoAwake) setAffirmationImage();
    });

    // Hide affirmation UI if click outside potato icon or affirmation area
    document.addEventListener('click', function(event) {
      const isClickOnIcon = iconButton.contains(event.target);
      const isClickOnUI = affirmationUI.contains(event.target);
      if (potatoAwake && !isClickOnIcon && !isClickOnUI) {
        icon.src = 'potato 3.PNG';
        potatoAwake = false;
        affirmationUI.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
