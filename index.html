<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rebecca Marston</title>
  <link rel="icon" type="image/png" href="IMG_3198.png" />
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }

    :root{
      /* Placeholders; JS overwrites on first load to your current viewport */
      --stage-w: 1920;
      --stage-h: 1080;
      --scale: 1;
    }

    /* -------- Base -------- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Digitany', sans-serif;
      background: #000;
    }
    body {
      /* Desk background that scrolls with the page */
      background: url('desk.PNG') top center repeat-y;
      background-size: 100% auto;
    }

    /* -------- Menu -------- */
    #icon-button {
      position: fixed;
      top: 20px;
      right: 40px;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img { width: 124px; height: 124px; pointer-events: auto; }

    #side-menu {
      position: fixed;
      top: 140px;
      right: -300px;
      width: 240px;
      height: 340px;
      background: url('menupopup.PNG') no-repeat center/contain;
      transition: right 0.4s cubic-bezier(.68,-0.55,.27,1.55);
      z-index: 2000;
      color: #4e3c17;
      font-family: 'Digitany', serif;
      letter-spacing: 0.5px;
      overflow: hidden;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #side-menu.show { right: -11px; }
    #side-menu ul { list-style: none; margin: 0; padding: 0; width: 80%; display: flex; flex-direction: column; align-items: center; }
    #side-menu li { margin: 28px 0; text-align: center; width: 100%; }
    #side-menu a { text-decoration: none; color: #4e3c17; font-size: 1.18em; font-family: 'Digitany', serif; transition: color .2s; display: block; }
    #side-menu a:hover { color: #a97e3f; text-shadow: 0 0 2px #fffbe4; }

    /* -------- Hero -------- */
    section { margin: 0; padding: 0; }
    .hero {
      position: relative;
      width: 100vw; height: 100vh; min-height: 500px;
      overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      z-index: 4;
      transition: opacity .3s;
      pointer-events: auto;
    }
    .video-background { position: absolute; inset: 0; background: url('49.jpg') center/cover no-repeat; z-index: 0; pointer-events: none; }
    #particles-js { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
    .hero h1 {
      position: relative; z-index: 5;
      font-size: 11vw; line-height: 1; color: #fff; text-align: center;
      margin: 120px 0 30px; letter-spacing: normal;
    }
    .scroll-bg {
      position: relative; z-index: 7;
      margin: 18px auto 0; width: 800px; min-width: 320px; height: 150px;
      background: url('scroll.png') center/100% 100% no-repeat;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.4em; color: #322100; text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
    }
    .scroll-bg span { padding-top: 22px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.05em; }

    /* -------- Main Content (one full viewport) -------- */
    .main-content{
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;         /* keep everything inside the viewport */
      isolation: isolate;       /* future-safe for blends */
      z-index: 2;
    }

    /* DESK STAGE: centered & scaled — lives in the page (scrolls) */
    .stage-desk{
      position: absolute;
      top: 50%; left: 50%;
      width: calc(var(--stage-w) * 1px);
      height: calc(var(--stage-h) * 1px);
      transform: translate(-50%, -50%) scale(var(--scale));
      transform-origin: center;
      z-index: 3;
    }

    /* UI LAYER: fixed overlay — separate parallax plane */
    .ui-layer{
      position: fixed; inset: 0;
      z-index: 5;
      pointer-events: none;     /* re-enable on children */
    }
    .stage-ui{
      position: absolute;
      top: 50%; left: 50%;
      width: calc(var(--stage-w) * 1px);
      height: calc(var(--stage-h) * 1px);
      transform: translate(-50%, -50%) scale(var(--scale));
      transform-origin: center;
    }

    /* Common rule for all placed items (desk + UI) */
    .stage-desk .piece,
    .stage-ui .piece{
      position: absolute;
      top: 0; left: 0;
      width: var(--w, 200px);
      transform:
        translate(var(--x, 0px), var(--y, 0px))
        rotate(var(--r, 0deg));
      transform-origin: top left;
      z-index: var(--z, 1);
    }
    .ui-layer .piece, .ui-layer .piece *{ pointer-events: auto; }
    .piece img{ width: 100%; height: auto; display: block; }

    /* -------- Small tweaks -------- */
    @media (max-width: 700px) {
      .hero h1 { font-size: 9vw; }
      .scroll-bg { width: 98vw; min-width: unset; }
    }
  </style>
</head>
<body>
  <!-- Fixed Menu Button and Menu -->
  <button id="icon-button">
    <img id="menu-icon" src="potato 3.PNG" alt="Menu">
  </button>
  <div id="side-menu">
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#currentwork">Current Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="video-background"></div>
    <div id="particles-js"></div>
    <h1>Rebecca Marston</h1>
    <div class="scroll-bg">
      <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <section class="main-content">
    <!-- DESK STAGE (scrolls with page) -->
    <div class="stage-desk" id="stageDesk">
      <img src="coffee mug.PNG"        alt="Coffee Mug"        class="piece" data-id="coffee-mug" />
      <img src="fiddleleaffig.PNG"     alt="Fiddle Leaf Fig"   class="piece" data-id="fiddle-leaf" />
      <img src="jadeplant.PNG"         alt="Jade Plant"        class="piece" data-id="jade" />
      <img src="planner.PNG"           alt="Planner"           class="piece" data-id="planner" />
      <img src="redbook.PNG"           alt="Red Book"          class="piece" data-id="red-book" />
      <img src="wisteriabonsai.PNG"    alt="Wisteria Bonsai"   class="piece" data-id="wisteria" />
    </div>

    <!-- UI LAYER (fixed) -->
    <div class="ui-layer">
      <div class="stage-ui" id="stageUI">
        <img src="AuthorUI.png"       class="piece" data-id="ui-author"      alt="Author UI" />
        <a   href="https://www.etsy[dot]com/shop/Elevatai" target="_blank" class="piece" data-id="ui-etsy">
          <img src="EtsyLink.png" alt="Etsy UI" />
        </a>
        <img src="CurrentWorksUI.png" class="piece" data-id="ui-current"     alt="Current Works UI" />
        <a   href="https://rebeccamarston.kit[dot]com/193ca21bb0" target="_blank" class="piece" data-id="ui-subscribe">
          <img src="SubscribeUI.png" alt="Subscribe UI" />
        </a>
      </div>
    </div>
  </section>

  <!-- Stage scaling (Option B): capture current viewport as base and fit everywhere -->
  <script>
    (function(){
      const rootStyle = document.documentElement.style;
      // 1) Capture your current viewport as the canonical design size
      const baseW = window.innerWidth;
      const baseH = window.innerHeight;
      rootStyle.setProperty('--stage-w', baseW);
      rootStyle.setProperty('--stage-h', baseH);

      // 2) Fit that stage into any new viewport while preserving aspect ratio
      function fit(){
        const scale = Math.min(window.innerWidth / baseW, window.innerHeight / baseH);
        rootStyle.setProperty('--scale', scale);
      }
      window.addEventListener('resize', fit, { passive: true });
      fit();
    })();
  </script>

  <!-- Layout map (single source of truth for x,y,width,rotation,z) -->
  <script>
    // DESK (scrolls with page)
    const DESK_MAP = {
      "coffee-mug": { x:-150, y:1000, w:820,  r:0,   z:3 },
      "fiddle-leaf":{ x:-300, y:-250, w:1000, r:0,   z:3 },
      "jade":        { x:-50,  y:300,  w:500,  r:0,   z:3 },
      "planner":     { x:20,   y:-50,  w:1300, r:25,  z:3 },
      "red-book":    { x:-800, y:800,  w:1200, r:0,   z:3 },
      "wisteria":    { x:-220, y:-120, w:1000, r:0,   z:3 }
    };

    // UI (fixed overlay)
    const UI_MAP = {
      "ui-author":    { x:400,  y:230,  w:700,  r:0,  z:5 },
      "ui-etsy":      { x:1480, y:915,  w:400,  r:0,  z:5 },
      "ui-current":   { x:20,   y:100,  w:1000, r:0,  z:5 },
      "ui-subscribe": { x:1120, y:680,  w:880,  r:0,  z:5 }
    };

    function applyLayout(rootSelector, map){
      const root = document.querySelector(rootSelector);
      if (!root) return;
      root.querySelectorAll('.piece').forEach(el => {
        const id = el.dataset.id;
        const p = map[id];
        if (!p) return;
        el.style.setProperty('--x', p.x + 'px');
        el.style.setProperty('--y', p.y + 'px');
        el.style.setProperty('--w', p.w + 'px');
        el.style.setProperty('--r', (p.r || 0) + 'deg');
        el.style.setProperty('--z', (p.z || 1));
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLayout('#stageDesk', DESK_MAP);
      applyLayout('#stageUI',   UI_MAP);
    });
  </script>

  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    // Particles
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });

    // Icon swap and menu toggle
    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const sideMenu = document.getElementById('side-menu');

    iconButton.addEventListener('click', () => {
      if (icon.src.endsWith('potato%203.PNG') || icon.src.endsWith('potato 3.PNG')) {
        icon.src = 'potatoawake.PNG';
        sideMenu.classList.add('show');
      } else {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });

    document.addEventListener('click', function(event) {
      const isClickOnMenu = sideMenu.contains(event.target);
      const isClickOnIcon = iconButton.contains(event.target);
      if (sideMenu.classList.contains('show') && !isClickOnMenu && !isClickOnIcon) {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });

    // HERO FADE-OUT ON SCROLL
    window.addEventListener('scroll', function() {
      const hero = document.querySelector('.hero');
      const h = window.innerHeight;
      const y = window.scrollY;
      const fadeEnd = h * 0.7;
      const opacity = y <= 0 ? 1 : Math.max(0, 1 - (y / fadeEnd));
      hero.style.opacity = opacity;
      hero.style.pointerEvents = (opacity < 0.1) ? "none" : "auto";
    });
  </script>
</body>
</html>
