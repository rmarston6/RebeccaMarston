<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="IMG_3198.png">
  <meta charset="UTF-8">
  <title>Rebecca Marston</title>
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Digitany', sans-serif;
      background: black;
    }
    /* --- Fixed Menu Button and Menu --- */
    #icon-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img {
      width: 83px;
      height: 83px;
      cursor: pointer;
      pointer-events: auto;
    }
    #side-menu {
      position: fixed;
      top: 120px;
      right: -300px;
      width: 240px;
      height: 340px;
      background: url('menupopup.PNG') no-repeat center center;
      background-size: contain;
      border: none;
      transition: right 0.4s cubic-bezier(.68,-0.55,.27,1.55);
      z-index: 2000;
      padding: 0;
      color: #4e3c17;
      font-family: 'Digitany', serif;
      letter-spacing: 0.5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #side-menu.show {
      right: -11px;
    }
    #side-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #side-menu li {
      margin: 28px 0;
      text-align: center;
      width: 100%;
    }
    #side-menu a {
      text-decoration: none;
      color: #4e3c17;
      font-size: 1.18em;
      font-family: 'Digitany', serif;
      transition: color 0.2s;
      display: block;
    }
    #side-menu a:hover {
      color: #a97e3f;
      text-shadow: 0 0 2px #fffbe4;
    }
    /* --- HERO SECTION --- */
    section {margin: 0;
             padding: 0;
      }
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: opacity 0.3s;
      pointer-events: auto;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .video-background {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; 
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: url('49.jpg') center center no-repeat;
      background-size: cover;
      background-position: center;
    }
    #particles-js {
      position: absolute;
      width: 100vw;
      height: 100vh;
      z-index: 4;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    /* REMOVED: .cloud-behind-name and related styles */
    .hero h1 {
      position: relative;
      z-index: 3;
      font-size: 11vw;
      margin: 0 0 0px 0;
      line-height: 1;
      font-family: 'Digitany', sans-serif;
      color: white;
      letter-spacing: normal;
      text-align: center;
      margin-bottom: 32px;
    }
    .scroll-bg {
      padding-top: 0px;
      padding-bottom: 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 18px auto 0 auto;
      width: 63vw;
      min-width: 320px;
      height: 120px;
      background: url('scroll.png') center center no-repeat;
      background-size: 100% 100%;
      z-index: 3;
      position: relative;
      font-size: 1.4em;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
    }
    .scroll-bg span {
      width: 100%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.05em;
    }
    /* --- MAIN CONTENT BELOW HERO --- */
    .main-content {
      position: relative;
      background: url('websitebackgroundbottom.jpg');
      background-size: cover;
      min-height: 300vh;
      background-position: center top;
      background-repeat: no-repeat;
      padding-bottom: 120px;
      width: 100%;
      z-index: 2;
      margin-top: 0;
      padding-top: 0;
    }
    /* Responsive tweaks */
    @media (max-width: 700px) {
      .hero h1 { font-size: 9vw; }
      .scroll-bg { width: 98vw; min-width: unset; }
    }
  </style>
</head>
<body>
  <!-- Fixed Menu Button and Menu -->
  <button id="icon-button">
    <img id="menu-icon" src="potato 3.PNG" alt="Menu">
  </button>
  <div id="side-menu">
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#currentwork">Current Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
  <!-- HERO SECTION -->
  <section class="hero" id="hero">
    <div class="video-background"></div>
    <div id="particles-js"></div>
    <!-- REMOVED: Cloud animation -->
    <h1>Rebecca Marston</h1>
    <div class="scroll-bg">
      <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
    </div>
  </section>
  <!-- MAIN CONTENT BELOW HERO -->
  <section class="main-content">
    <!-- More content here -->
  </section>
  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });

    // Icon swap and menu toggle
    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const sideMenu = document.getElementById('side-menu');

    iconButton.addEventListener('click', () => {
      if (
        icon.src.endsWith('potato%203.PNG') ||
        icon.src.endsWith('potato 3.PNG')
      ) {
        icon.src = 'potatoawake.PNG';
        sideMenu.classList.add('show');
      } else {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });

    document.addEventListener('click', function(event) {
      const isClickOnMenu = sideMenu.contains(event.target);
      const isClickOnIcon = iconButton.contains(event.target);

      if (sideMenu.classList.contains('show') && !isClickOnMenu && !isClickOnIcon) {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });

    // HERO FADE-OUT ON SCROLL
    window.addEventListener('scroll', function() {
      const hero = document.querySelector('.hero');
      let scrollY = window.scrollY;
      let fadeStart = 0, fadeEnd = window.innerHeight * 0.7;
      let opacity = 1;
      if (scrollY > fadeStart) {
        opacity = 1 - Math.min((scrollY - fadeStart) / (fadeEnd - fadeStart), 1);
      }
      hero.style.opacity = opacity;
      hero.style.pointerEvents = (opacity < 0.1) ? "none" : "auto";
    });
  </script>
</body>
</html>
