<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="IMG_3198.png">
  <meta charset="UTF-8">
  <title>Rebecca Marston</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      font-family: 'Digitany', sans-serif;
      background: black;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      width: 100vw;
      min-height: 100vh;
      background: url('desk.PNG') center center / cover;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* --- Fixed Menu Button and Menu --- */
    #icon-button {
      position: fixed;
      top: 2vw;
      right: 4vw;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img {
      width: 11vw;
      height: 11vw;
      max-width: 124px;
      max-height: 124px;
      cursor: pointer;
      pointer-events: auto;
    }
    #side-menu {
      position: fixed;
      top: 14vw;
      right: -80vw; /* pushed further out of sight */
      width: 18vw;
      min-width: 180px;
      height: 22vw;
      min-height: 220px;
      background: url('menupopup.PNG') no-repeat center center;
      background-size: contain;
      border: none;
      transition: right 0.4s cubic-bezier(.68,-0.55,.27,1.55);
      z-index: 2000;
      padding: 0;
      color: #4e3c17;
      font-family: 'Digitany', serif;
      letter-spacing: 0.5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #side-menu.show {
      right: 1vw;
    }
    #side-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #side-menu li {
      margin: 2vw 0;
      text-align: center;
      width: 100%;
    }
    #side-menu a {
      text-decoration: none;
      color: #4e3c17;
      font-size: 1.2em;
      font-family: 'Digitany', serif;
      transition: color 0.2s;
      display: block;
    }
    #side-menu a:hover {
      color: #a97e3f;
      text-shadow: 0 0 2px #fffbe4;
    }

    /* --- HERO SECTION --- */
    .hero {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 4;
      pointer-events: auto;
      margin: 0;
      padding: 0;
    }
    .video-background {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: url('49.jpg') center center no-repeat;
      background-size: cover;
    }
    #particles-js {
      position: absolute;
      width: 100vw;
      height: 100vh;
      z-index: 6;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .hero h1 {
      position: relative;
      z-index: 5;
      font-size: 8vw;
      margin: 0;
      line-height: 1;
      font-family: 'Digitany', sans-serif;
      color: white;
      letter-spacing: normal;
      text-align: center;
      margin-bottom: 2vw;
      margin-top: 6vw;
      width: 100vw;
      word-break: break-word;
    }
    .scroll-bg {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2vw auto 0 auto;
      width: 90vw;
      min-width: 180px;
      height: 7vw;
      background: url('scroll.png') center center no-repeat;
      background-size: cover;
      z-index: 7;
      position: relative;
      font-size: 1.5vw;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
    }
    .scroll-bg span {
      padding-top: 0.8vw;
      width: 100%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      word-break: break-word;
    }

    /* --- MAIN CONTENT --- */
    .main-content {
      display: grid;
      position: relative;
      background: none;
      width: 100vw;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2vw;
      isolation: isolate;
      z-index: 2;
      padding-bottom: 70px;
      padding-top: 6vw;
      min-height: 650px;
      max-height: 760px;
    }
    /* Default, but now easily overridden by individual classes */
    .main-content img,
    .ui-layer img {
      width: 80%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;
    }

    /* --- Individual PNG Sizing: Desktop/tablet --- */
    .coffee-mug      { width: 60%; max-width: 140px; }
    .fiddle-leaf-fig-plant { width: 85%; max-width: 180px; }
    .jade-plant      { width: 70%; max-width: 120px; }
    .planner         { width: 82%; max-width: 160px; }
    .red-book        { width: 50%; max-width: 100px; }
    .wisteriabonsai  { width: 60%; max-width: 140px; }

    .ui-author       { width: 88%; max-width: 180px; }
    .ui-etsy         { width: 75%; max-width: 160px; }
    .ui-current-works{ width: 90%; max-width: 200px; }
    .ui-subscribe    { width: 70%; max-width: 140px; }

    /* --- Responsive tweaks --- */
    @media (max-width: 700px), (max-height: 700px) {
      .hero,
      .video-background,
      #particles-js {
        width: 100vw;
        min-height: 100vh;
        height: 100vh;
        max-height: 100vh;
      }
      .hero h1 { font-size: 12vw; margin-top: 10vw; width: 100vw; }
      .scroll-bg { width: 97vw; font-size: 4vw; height: 12vw; min-width: 120px;}
      .main-content {
        min-height: 490px;
        max-height: 540px;
        padding-top: 6vw;
        padding-bottom: 50px;
      }
      /* --- Individual PNG Sizing: Mobile --- */
      .coffee-mug         { width: 40%; max-width: 70px; }
      .fiddle-leaf-fig-plant { width: 55%; max-width: 90px; }
      .jade-plant         { width: 45%; max-width: 60px; }
      .planner            { width: 100%; max-width: none; }
      .red-book           { width: 32%; max-width: 50px; }
      .wisteriabonsai     { width: 35%; max-width: 70px; }

      .ui-author          { width: 60%; max-width: 80px; }
      .ui-etsy            { width: 50%; max-width: 70px; }
      .ui-current-works   { width: 70%; max-width: 100px; }
      .ui-subscribe       { width: 40%; max-width: 100px; }
    }
  </style>
</head>
<body>
    <!-- Fixed Menu Button and Menu -->
    <button id="icon-button">
      <img id="menu-icon" src="potato 3.PNG" alt="Menu">
    </button>
    <div id="side-menu">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#currentwork">Current Work</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
    <!-- HERO SECTION -->
    <section class="hero" id="hero">
      <div class="video-background"></div>
      <div id="particles-js"></div>
      <h1>Rebecca Marston</h1>
      <div class="scroll-bg">
        <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
      </div>
    </section>
    <!-- MAIN CONTENT BELOW HERO -->
    <section class="main-content">
      <img src="coffee mug.PNG" alt="Coffee Mug" class="coffee-mug" />
      <img src="fiddleleaffig.PNG" alt="Fiddle Leaf Fig" class="fiddle-leaf-fig-plant" />
      <img src="jadeplant.PNG" alt="Jade Plant" class="jade-plant" />
      <img src="planner.PNG" alt="Planner" class="planner" />
      <img src="redbook.PNG" alt="Red Book" class="red-book" />
      <img src="wisteriabonsai.PNG" alt="Wisteria Bonsai" class="wisteriabonsai" />
      <!-- Foreground UI Windows -->
      <div class="ui-layer">
        <img src="AuthorUI.png" class="ui-author" alt="Author UI" />
        <a href="https://www.etsy.com/shop/Elevatai" target="_blank" class="ui-etsy">
          <img src="EtsyLink.png" alt="Etsy UI" />
        </a>
        <img src="CurrentWorksUI.png" class="ui-current-works" alt="Current Works UI" />
        <a href="https://rebeccamarston.kit.com/193ca21bb0" target="_blank" class="ui-subscribe">
          <img src="SubscribeUI.png" alt="Subscribe UI" />
        </a>
      </div>
    </section>
  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });
    // Icon swap and menu toggle
    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const sideMenu = document.getElementById('side-menu');
    iconButton.addEventListener('click', () => {
      if (
        icon.src.endsWith('potato%203.PNG') ||
        icon.src.endsWith('potato 3.PNG')
      ) {
        icon.src = 'potatoawake.PNG';
        sideMenu.classList.add('show');
      } else {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });
    document.addEventListener('click', function(event) {
      const isClickOnMenu = sideMenu.contains(event.target);
      const isClickOnIcon = iconButton.contains(event.target);
      if (sideMenu.classList.contains('show') && !isClickOnMenu && !isClickOnIcon) {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });
    // No scroll fade!
  </script>
</body>
</html>
