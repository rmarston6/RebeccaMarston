<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      width: 100vw; height: 100vh;
      margin: 0; padding: 0;
      overflow: hidden;
    }
    .aspect-content-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: url('desk.PNG') center center / cover;
    }
    .aspect-ratio-box {
      width: 100vw;
      height: calc(100vw * 0.75); /* 4:3 aspect ratio */
      max-width: 100vw;
      max-height: 100vh;
      background: rgba(255,255,255,0.01);
      position: relative;
    }
    @media (max-aspect-ratio: 4/3) {
      .aspect-ratio-box {
        width: calc(100vh * 1.3333);
        height: 100vh;
      }
    }
    .responsive-grid {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2vw;
      position: absolute; top: 0; left: 0;
    }
    .grid-item {
      width: 80%; height: 80%;
      object-fit: contain;
      justify-self: center; align-self: center;
    }
  </style>
</head>
<body>
  <div class="aspect-content-wrapper">
    <div class="aspect-ratio-box">
      <div class="responsive-grid">
        <!-- Your images/components here -->
      </div>
    </div>
  </div>
</body>
</html>
