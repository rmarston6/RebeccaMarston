<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="IMG_3198.png">
  <meta charset="UTF-8">
  <title>Rebecca Marston</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: 'Digitany', sans-serif;
      background: black;
      overflow: hidden;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('desk.PNG') center center / cover;
      overflow: hidden;
    }
    /* Aspect ratio wrapper for main content */
    .aspect-ratio-box {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
    }
    @media (max-aspect-ratio: 16/9) {
      .aspect-ratio-box {
        width: 100vw;
        height: 100vh;
      }
    }

    /* HERO SECTION: edge-to-edge fix */
    .hero {
      position: relative;
      width: 100vw;
      height: 60vh; /* 60% of viewport height; adjust as needed */
      margin: 0;
      padding: 0;
      min-height: 200vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 4;
      transition: opacity 0.3s;
      pointer-events: auto;
    }
    .video-background {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: url('49.jpg') center center no-repeat;
      background-size: cover;
      margin: 0;
      padding: 0;
    }
    #particles-js {
      position: absolute;
      width: 100vw;
      height: 100%;
      z-index: 6;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .hero h1 {
      position: relative;
      z-index: 5;
      font-size: 8vw;
      margin: 0;
      line-height: 1;
      font-family: 'Digitany', sans-serif;
      color: white;
      letter-spacing: normal;
      text-align: center;
      margin-bottom: 2vw;
      margin-top: 6vw;
      width: 100vw;
      word-break: break-word;
    }
    .scroll-bg {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1vw auto 0 auto;
      width: 90vw;
      min-width: 180px;
      height: 7vw;
      background: url('scroll.png') center center no-repeat;
      background-size: cover;
      z-index: 7;
      position: relative;
      font-size: 1.5vw;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
    }
    .scroll-bg span {
      padding-top: 0.8vw;
      width: 100%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      word-break: break-word;
    }

    /* MAIN CONTENT BELOW HERO */
    .main-content {
      display: grid;
      position: relative;
      background: none;
      width: 100vw;
      height: 40vh;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2vw;
      isolation: isolate;
      z-index: 2;
      min-height: 200px;
    }
    .main-content img {
      width: 80%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      transition: all 0.2s;
    }
    .coffee-mug      { grid-column: 1; grid-row: 4; transform: translate(0,0); }
    .fiddle-leaf-fig-plant { grid-column: 4; grid-row: 1; transform: translate(0,0);}
    .jade-plant      { grid-column: 1; grid-row: 3; transform: translate(0,0);}
    .planner         { grid-column: 2; grid-row: 2; transform: translate(0,0) rotate(8deg);}
    .red-book        { grid-column: 4; grid-row: 4; transform: translate(0,0);}
    .wisteria-bonsai { grid-column: 1; grid-row: 1; transform: translate(0,0);}
    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100%;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 2vw;
      pointer-events: none;
    }
    .ui-layer img,
    .ui-layer a {
      pointer-events: auto;
      width: 80%;
      max-width: 100%;
      max-height: 100%;
      justify-self: center;
      align-self: center;
    }
    .ui-author { grid-column: 1; grid-row: 1; }
    .ui-etsy   { grid-column: 4; grid-row: 2; }
    .ui-current-works { grid-column: 1; grid-row: 2; }
    .ui-subscribe { grid-column: 4; grid-row: 3; }

    /* Fixed Menu Button and Menu */
    #icon-button {
      position: absolute;
      top: 2vw;
      right: 4vw;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    #icon-button img {
      width: 11vw;
      height: 11vw;
      max-width: 124px;
      max-height: 124px;
      cursor: pointer;
      pointer-events: auto;
    }
    #side-menu {
      position: absolute;
      top: 14vw;
      right: -30vw;
      width: 18vw;
      min-width: 180px;
      height: 22vw;
      min-height: 220px;
      background: url('menupopup.PNG') no-repeat center center;
      background-size: contain;
      border: none;
      transition: right 0.4s cubic-bezier(.68,-0.55,.27,1.55);
      z-index: 2000;
      padding: 0;
      color: #4e3c17;
      font-family: 'Digitany', serif;
      letter-spacing: 0.5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #side-menu.show {
      right: 1vw;
    }
    #side-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #side-menu li {
      margin: 2vw 0;
      text-align: center;
      width: 100%;
    }
    #side-menu a {
      text-decoration: none;
      color: #4e3c17;
      font-size: 1.2em;
      font-family: 'Digitany', serif;
      transition: color 0.2s;
      display: block;
    }
    #side-menu a:hover {
      color: #a97e3f;
      text-shadow: 0 0 2px #fffbe4;
    }

    /* Responsive tweaks */
    @media (max-width: 700px), (max-height: 700px) {
      .aspect-ratio-box { width: 100vw; height: 100vh; }
      .hero {
        min-height: 140px;
        height: 65vh;
        max-height: none;
      }
      .hero h1 { font-size: 12vw; margin-top: 10vw; width: 100vw; }
      .scroll-bg { width: 97vw; font-size: 4vw; height: 12vw; min-width: 120px;}
      .main-content { min-height: 150px; height: 35vh; }
      .main-content img { width: 88%; }
      .ui-layer img, .ui-layer a { width: 90%; }
      #icon-button img { width: 17vw; height: 17vw; }
      #side-menu { width: 30vw; min-width: 180px; height: 40vw; min-height: 220px;}
    }
  </style>
</head>
<body>
  <div class="aspect-ratio-box">
    <!-- Fixed Menu Button and Menu -->
    <button id="icon-button">
      <img id="menu-icon" src="potato 3.PNG" alt="Menu">
    </button>
    <div id="side-menu">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#currentwork">Current Work</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
    <!-- HERO SECTION -->
    <section class="hero" id="hero">
      <div class="video-background"></div>
      <div id="particles-js"></div>
      <h1>Rebecca Marston</h1>
      <div class="scroll-bg">
        <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
      </div>
    </section>
    <!-- MAIN CONTENT BELOW HERO -->
    <section class="main-content">
      <img src="coffee mug.PNG" alt="Coffee Mug" class="coffee-mug" />
      <img src="fiddleleaffig.PNG" alt="Fiddle Leaf Fig" class="fiddle-leaf-fig-plant" />
      <img src="jadeplant.PNG" alt="Jade Plant" class="jade-plant" />
      <img src="planner.PNG" alt="Planner" class="planner" />
      <img src="redbook.PNG" alt="Red Book" class="red-book" />
      <img src="wisteriabonsai.PNG" alt="Wisteria Bonsai" class="wisteria-bonsai" />
      <!-- Foreground UI Windows -->
      <div class="ui-layer">
        <img src="AuthorUI.png" class="ui-author" alt="Author UI" />
        <a href="https://www.etsy.com/shop/Elevatai" target="_blank" class="ui-etsy">
          <img src="EtsyLink.png" alt="Etsy UI" />
        </a>
        <img src="CurrentWorksUI.png" class="ui-current-works" alt="Current Works UI" />
        <a href="https://rebeccamarston.kit.com/193ca21bb0" target="_blank" class="ui-subscribe">
          <img src="SubscribeUI.png" alt="Subscribe UI" />
        </a>
      </div>
    </section>
  </div>
  <!-- PARTICLE LIBRARY -->
  <script src="particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('Particles.js config loaded');
    });
    // Icon swap and menu toggle
    const iconButton = document.getElementById('icon-button');
    const icon = document.getElementById('menu-icon');
    const sideMenu = document.getElementById('side-menu');
    iconButton.addEventListener('click', () => {
      if (
        icon.src.endsWith('potato%203.PNG') ||
        icon.src.endsWith('potato 3.PNG')
      ) {
        icon.src = 'potatoawake.PNG';
        sideMenu.classList.add('show');
      } else {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });
    document.addEventListener('click', function(event) {
      const isClickOnMenu = sideMenu.contains(event.target);
      const isClickOnIcon = iconButton.contains(event.target);
      if (sideMenu.classList.contains('show') && !isClickOnMenu && !isClickOnIcon) {
        icon.src = 'potato 3.PNG';
        sideMenu.classList.remove('show');
      }
    });
    // HERO FADE-OUT ON SCROLL
    window.addEventListener('scroll', function() {
      const hero = document.querySelector('.hero');
      let scrollY = window.scrollY;
      let fadeStart = 0, fadeEnd = window.innerHeight * 0.7;
      let opacity = 1;
      if (scrollY > fadeStart) {
        opacity = 1 - Math.min((scrollY - fadeStart) / (fadeEnd - fadeStart), 1);
      }
      hero.style.opacity = opacity;
      hero.style.pointerEvents = (opacity < 0.1) ? "none" : "auto";
    });
  </script>
</body>
</html>
