<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scroll UI Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Digitany';
      src: url('Digitany.otf') format('opentype');
    }
    body {
      background: #181818;
      color: #322100;
      font-family: 'Digitany', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .scroll-bg {
      /* Set aspect ratio to match image, e.g. 4:1 (width:height) */
      aspect-ratio: 4 / 1; /* Adjust if your image has a different ratio */
      width: 70vw;
      max-width: 600px;
      min-width: 180px;
      background: url('scroll.png') center center no-repeat;
      background-size: contain;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2vw auto 0 auto;
      position: relative;
      z-index: 7;
      font-size: 1.2vw;
      color: #322100;
      text-shadow: 0 1px 8px #fffbe4, 0 0 2px #fffbe4;
      font-family: 'Digitany', serif;
      box-shadow: 0 2px 12px rgba(80,60,40,0.15);
      text-align: center;
      overflow: hidden;
    }
    .scroll-bg span {
      width: 90%;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      word-break: break-word;
      /* Remove transform unless necessary for fine-tuning */
    }

    /* Responsive tweaks for smaller screens */
    @media (max-width: 700px), (max-height: 700px) {
      .scroll-bg {
        width: 97vw;
        font-size: 4vw;
        min-width: 120px;
        max-width: 100vw;
        aspect-ratio: 4 / 1;
        height: auto;
      }
      .scroll-bg span {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <!-- Scroll UI Demo -->
  <div class="scroll-bg">
    <span>Author of soft apocalypses, life-affirming grief, and wild gardens of tangled thought.</span>
  </div>
</body>
</html>
